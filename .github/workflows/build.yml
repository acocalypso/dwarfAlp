name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # protoc for protobuf codegen; libGL/EGL/xcb for PySide6 import under xvfb
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler xvfb \
            libgl1 libegl1 libxkbcommon0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[development]

      - name: Generate protobuf modules
        run: bash gen_pb2.sh

      - name: Run tests
        run: xvfb-run -a pytest

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libfuse2 \
            libgl1 libegl1 libxkbcommon0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Generate protobuf modules
        run: bash gen_pb2.sh

      - name: Build AppImage
        run: bash scripts/build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DwarfAlpacaGUI-linux-x86_64
          path: dist/*.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Generate protobuf modules
        shell: bash
        run: bash gen_pb2.sh

      - name: Build executable
        run: pyinstaller --noconfirm packaging/dwarf_alpaca_gui.spec

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DwarfAlpacaGUI-windows-x86_64
          path: dist/DwarfAlpacaGUI.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DwarfAlpacaGUI.exe
