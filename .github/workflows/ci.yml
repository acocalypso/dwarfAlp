name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true

      - name: Install locked development dependencies
        run: uv sync --extra development --locked

      - name: Lint
        run: uv run ruff check .

      - name: Validate protobuf bindings
        run: uv run python scripts/generate_protos.py --check

      - name: Check documentation links
        run: uv run python scripts/check_markdown_links.py

      - name: Run automated tests
        run: uv run pytest -p no:cacheprovider

      - name: Regenerate API documentation
        run: uv run python scripts/generate_api_site.py

      - name: Verify generated API documentation is current
        run: git diff --exit-code -- docs/site
