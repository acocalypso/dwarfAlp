name: Build and release Windows executable

run-name: Release ${{ github.ref_type == 'tag' && github.ref_name || 'version from pyproject.toml' }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Windows release
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      MANUAL_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $projectVersion = (python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          if ($projectVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Project version '$projectVersion' must use a version such as 0.1.0 or 0.1.0-rc.1."
          }
          $releaseTag = "v$projectVersion"

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $releaseTag) {
            throw "Git tag '${{ github.ref_name }}' does not match pyproject.toml version '$releaseTag'."
          }

          "PROJECT_VERSION=$projectVersion" >> $env:GITHUB_ENV
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "version=$projectVersion" >> $env:GITHUB_OUTPUT
          "tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "Building dwarfAlp $projectVersion as release $releaseTag"

      - name: Install locked dependencies
        run: uv sync --extra development --locked

      - name: Run lint checks
        run: uv run ruff check src tests

      - name: Run tests
        run: uv run pytest -q -p no:cacheprovider

      - name: Build executable
        shell: pwsh
        run: |
          # The runtime state directory and PyInstaller spec are intentionally
          # gitignored, so create/package from source on a clean checkout.
          New-Item -ItemType Directory -Path "var" -Force | Out-Null
          uv run pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name DwarfAlpacaGUI `
            --icon "images\dwarfalplogo.ico" `
            --add-data "images;images" `
            --add-data "var;var" `
            --collect-data "tzdata" `
            --copy-metadata "dwarf-alpaca" `
            --paths "src" `
            "run_gui.py"

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null

          $assetName = "DwarfAlpacaGUI-$env:PROJECT_VERSION-windows-x64.exe"
          $assetPath = Join-Path $assetDirectory $assetName
          Copy-Item -LiteralPath "dist\DwarfAlpacaGUI.exe" -Destination $assetPath

          $checksumPath = Join-Path $assetDirectory "SHA256SUMS.txt"
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath $checksumPath -Encoding utf8

          "directory=$assetDirectory" >> $env:GITHUB_OUTPUT
          "executable=$assetPath" >> $env:GITHUB_OUTPUT
          "checksum=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DwarfAlpacaGUI-${{ steps.version.outputs.version }}-windows-x64
          path: ${{ steps.assets.outputs.directory }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTitle = "dwarfAlp $env:RELEASE_TAG"
          $isPrerelease = $env:MANUAL_PRERELEASE -eq "true" -or $env:RELEASE_TAG.Contains("-")
          $releaseExists = $null -ne (gh release view $env:RELEASE_TAG 2>$null)

          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG `
              "${{ steps.assets.outputs.executable }}#Windows x64 executable" `
              "${{ steps.assets.outputs.checksum }}#SHA-256 checksums" `
              --clobber
            exit $LASTEXITCODE
          }

          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            "${{ steps.assets.outputs.executable }}#Windows x64 executable",
            "${{ steps.assets.outputs.checksum }}#SHA-256 checksums",
            "--title", $releaseTitle,
            "--generate-notes",
            "--target", $env:GITHUB_SHA
          )
          if ($isPrerelease) {
            $arguments += "--prerelease"
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
