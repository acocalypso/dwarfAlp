syntax = "proto3";

enum OperationState {
    OPERATION_STATE_IDLE = 0;
    OPERATION_STATE_RUNNING = 1;
    OPERATION_STATE_STOPPING = 2;
    OPERATION_STATE_STOPPED = 3;
}

// Mount-calibration progress notification: CMD 15210.
enum AstroState {
    ASTRO_STATE_IDLE = 0;
    ASTRO_STATE_RUNNING = 1;
    ASTRO_STATE_STOPPING = 2;
    ASTRO_STATE_STOPPED = 3;
    ASTRO_STATE_PLATE_SOLVING = 4;
}

message AstroCalibrationState {
    AstroState state = 1;
    int32 plate_solving_times = 2;
}

// Successful V3 mount-calibration result for all DWARF models: CMD 15256.
// Recovered from the DWARFLAB 3.4.1 embedded notify.proto descriptor.
message CalibrationResult {
    double azi = 1;
    double alt = 2;
}

// V3 one-click calibration + GoTo state: CMD 15233.
message ResNotifyOneClickGotoState {
    OperationState state = 1;
}

// Astronomy live-stacking progress: CMD 15209.
// `stacked_count` is the number of completed, accepted stack frames and is the
// safe boundary for stopping a finite Alpaca exposure sequence.
message ResNotifyProgressCaptureRawLiveStacking {
    int32 total_count = 1;
    int32 update_count_type = 2;
    int32 current_count = 3;
    int32 stacked_count = 4;
    int32 exp_index = 5;
    int32 gain_index = 6;
    string target_name = 7;
}
