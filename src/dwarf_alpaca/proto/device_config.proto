syntax = "proto3";

// V3 Module 14: Device Config

// Mode query: CMD 16402
message V3ReqModeQuery {
    int32 target_mode = 1;
}

message V3ResModeQuery {
    int32 code = 1;
    int32 mode = 2;
}

// Shooting mode switch: CMD 16403
message V3ReqShootingModeSwitch {
    int32 mode_id = 1; // 1=photo, 2=deep sky/astro, 3=burst, 4=video, 5=timelapse
}

message V3ResShootingModeSwitch {
    int32 code = 1;
    int32 mode_id = 2;
}

// Mode switch: CMD 16404
message V3ReqModeSwitch {
    int32 field1 = 1;
    int32 field2 = 2;
    V3ModeSwitchInner inner = 3;
}

message V3ModeSwitchInner {
    int32 value = 1;
}

message V3ResModeSwitch {
    int32 code = 1;
    int32 mode = 2;
}

// Whole-device state query: CMD 16405. This is a wire-compatible subset of
// task_center.proto recovered from DWARF Mini firmware 1.1.3.2. Unknown fields
// in the full firmware response are intentionally ignored by protobuf.
message ReqGetDeviceStateInfo {
}

message CaptureRawStateSnapshot {
    int32 state = 1;
    int32 camera_type = 2;
}

message ExclusiveCameraStateSnapshot {
    CaptureRawStateSnapshot capture_raw_state = 1;
}

message TeleCameraStateInfoSnapshot {
    ExclusiveCameraStateSnapshot exclusive_state = 1;
    double h_fov = 3;
    double v_fov = 4;
    uint32 resolution_width = 5;
    uint32 resolution_height = 6;
    CmosTemperatureSnapshot cmos_temperature = 7;
}

message CmosTemperatureSnapshot {
    optional int32 temperature = 1;
    int32 camera_type = 2;
}

message DeviceCalibrationResultSnapshot {
    double azi = 1;
    double alt = 2;
}

message DeviceStateInfoSnapshot {
    DeviceCalibrationResultSnapshot calibration_result = 10;
}

message ResGetDeviceStateInfo {
    int32 shooting_mode = 1;
    TeleCameraStateInfoSnapshot tele_camera_state_info = 2;
    DeviceStateInfoSnapshot device_state_info = 6;
    int32 code = 7;
}
