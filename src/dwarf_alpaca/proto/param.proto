syntax = "proto3";

package param;

message ReqSetExposure {
    uint64 param_id = 1;
    int32 mode = 2;
    int32 value = 3;
}

message ReqSetGain {
    uint64 param_id = 1;
    int32 mode = 2;
    int32 value = 3;
}

message ReqSetWb {
    uint64 param_id = 1;
    int32 mode = 2;
    int32 value = 3;
}

message ReqSetGeneralIntParam {
    uint64 param_id = 1;
    int32 value = 2;
}

message ReqSetGeneralFloatParam {
    uint64 param_id = 1;
    float value = 2;
}

message ReqSetGeneralBoolParams {
    uint64 param_id = 1;
    bool value = 2;
}

message ReqSetAutoParam {
    int32 camera_type = 1;
    int32 shooting_tech = 2;
    bool is_auto = 3;
}

message ResSetAutoParam {
    int32 shooting_mode = 1;
    int32 camera_type = 2;
    int32 shooting_tech = 3;
    bool is_auto = 4;
    bool update_all = 5;
    int32 code = 6;
}
