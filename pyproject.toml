[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "dwarf-alpaca"
version = "0.1.0"
description = "ASCOM Alpaca server exposing a DWARF 3 telescope as Telescope/0, Camera/0, and Focuser/0 devices."
readme = "README.md"
authors = [
  { name = "Astro Tools" }
]
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.141.1,<1",
  "uvicorn[standard]>=0.52.0,<1",
  "alpyca>=3.1.2,<4",
  "httpx>=0.28.1,<1",
  "pydantic-settings>=2.14.2,<3",
  "structlog>=26.1.0,<27",
  "bleak>=1.1.1,<3",
  "aiortc>=1.15.0,<1.16",
  "av>=14,<17",
  "numpy>=2.2,<2.3; python_version < '3.12'",
  "numpy>=2.2,<3; python_version >= '3.12'",
  "opencv-python-headless>=4.12,<5",
  "python-dotenv>=1.1.1",
  "python-multipart>=0.0.20",
  "protobuf>=7.35.1,<8",
  "websockets>=15.0.1,<18",
  "PySide6>=6.10,<6.12"
]

[project.optional-dependencies]
development = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "httpx[cli]>=0.28.1",
  "ruff>=0.16.0,<1",
  "grpcio-tools==1.83.0",
  "build>=1.5,<2",
  "pyinstaller>=6.21,<7"
]

[project.scripts]
dwarf-alpaca = "dwarf_alpaca.cli:main"
dwarf-alpaca-gui = "dwarf_alpaca.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dwarf_alpaca"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/dwarf_alpaca/proto/*_pb2.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = [
  "hardware: opt-in tests that communicate with a physical DWARF device",
]
filterwarnings = [
  "ignore::DeprecationWarning:google.protobuf.internal.well_known_types",
]
